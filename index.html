<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz BD</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:0 auto;padding:16px;background:#f4f6fb;color:#1c2333;line-height:1.5}
h1{color:#1f3a8a;font-size:1.4rem}
button{font-family:inherit}
nav button,.btn{background:#1f3a8a;color:#fff;border:0;padding:10px 16px;border-radius:8px;cursor:pointer;font-size:1rem;margin:2px}
nav button.off{background:#cbd5e1;color:#1c2333}
.card{background:#fff;border-radius:10px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0002}
.card h3{margin:0 0 6px;color:#1f3a8a}
.card ul{margin:4px 0;padding-left:20px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #cbd5e1;border-radius:8px;padding:10px;margin:6px 0;cursor:pointer;font-size:1rem}
.opt.ok{background:#dcfce7;border-color:#16a34a}.opt.bad{background:#fee2e2;border-color:#dc2626}
.exp{background:#fef9c3;padding:10px;border-radius:8px;margin:8px 0}
label{display:block;margin:4px 0}.hide{display:none}
.opt.sel{border-color:#1f3a8a;background:#e0e7ff}.inc{background:#e0f2fe;padding:10px;border-radius:8px;margin:8px 0}.nav2{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.btn:disabled{opacity:.4;cursor:not-allowed}summary{cursor:pointer}</style></head><body>
<h1>📚 Quiz – Funciones Avanzadas de BD</h1>
<nav><button id="bT" onclick="tab('T')">📖 Teoría</button><button id="bQ" class="off" onclick="tab('Q')">📝 Quiz</button></nav>
<div id="T"></div>
<div id="Q" class="hide"><div id="setup" class="card"></div><div id="game"></div></div>

<script src="app.js"></script>
</body></html>
